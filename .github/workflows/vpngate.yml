name: VPN Gate Node Check

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC); adjust here
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Fetch VPN Gate nodes, check via Cloudflare Worker, build site
        id: gate
        run: python src/vpngate.py
        env:
          DOMAIN: ${{ secrets.DOMAIN }}          # Worker check endpoint (Secret, never in code)
          PUBLIC_DIR: ${{ github.workspace }}/public
          NODES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          RETRY_ATTEMPTS: "3"
          BREAKER_THRESHOLD: "25"

      # Only publish when a valid, non-empty result was produced; otherwise the previous Pages deployment stays live.
      - name: Configure Pages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.gate.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          {
            echo "### VPN Gate check"
            echo "- publish: \`${{ steps.gate.outputs.publish }}\`  available nodes: \`${{ steps.gate.outputs.available }}\`"
            echo "- nodes.txt: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          } >> "$GITHUB_STEP_SUMMARY"